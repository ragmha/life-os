appId: io.raghib.lifeos
---
# App Flow Test - Tests basic app navigation and functionality
- launchApp
- assertVisible: "Home"
- takeScreenshot: home-screen

# Log device and app information for debugging
- evalScript: |
    try {
      console.log("App ID: " + maestro.appId);
      console.log("Device: " + (maestro.device || "unknown"));
      console.log("Platform: " + (maestro.platform || "unknown"));
      console.log("Screen size: " + (maestro.screenWidth || "unknown") + "x" + (maestro.screenHeight || "unknown"));
    } catch (e) {
      console.log("Error getting Maestro info: " + e.message);
    }

# Test tab navigation
- tapOn:
    id: "tab-settings"
- assertVisible: ".*"
- takeScreenshot: settings-screen

# Test Calendar Component
- tapOn:
    id: "tab-home"
- assertVisible: "Home"
- takeScreenshot: calendar-view

# Test current date is selected
- assertVisible:
    id: "calendar-container"
- takeScreenshot: calendar-current-date

# Test date selection by tapping on a different date
- tapOn:
    id: "day-item"
    index: 1
- takeScreenshot: calendar-date-selected

# Test navigation between weeks
- swipeLeft
- takeScreenshot: calendar-previous-week
- swipeRight
- swipeRight
- takeScreenshot: calendar-next-week

# Navigate back to Home tab
- tapOn:
    id: "tab-home"
- assertVisible: "Home"
- takeScreenshot: home-screen-final

# Test back button functionality
- back
- takeScreenshot: after-back 